name: Quality — Astro Portfolio
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  astro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Dossier content and motion guards
        run: node scripts/check-dossier.mjs
      - name: Astro production build
        run: npm run build
      - name: Check dist for secrets
        shell: bash
        run: |
          if grep -R -E '(FILAMENT_API_TOKEN|KRAFTDO_SUPERADMIN_EMAIL|COMPOSER_GH_TOKEN|BEGIN (RSA|OPENSSH) PRIVATE KEY)' dist; then
            echo "::error::Possible sensitive identifier in generated files"
            exit 1
          fi
